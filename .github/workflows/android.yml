name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK
        run: ./gradlew --no-daemon assembleRelease
      - name: Check APK contents
        run: |
          apk=$(ls app/build/outputs/apk/release/*.apk)
          unzip -l "$apk" | grep -E "lib/arm64-v8a/|classes" 
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libsherpa-onnx-jni.so"
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libonnxruntime.so"
      - uses: actions/upload-artifact@v4
        with:
          name: earshot-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
