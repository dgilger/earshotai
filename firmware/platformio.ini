; Earshot firmware — Hosyond 2.8" ESP32-S3 touchscreen (ES3C28P)
; ESP32-S3R8 (8MB octal PSRAM) + 16MB QSPI flash. USB-C is wired straight to
; GPIO19/20 (native USB, no USB-UART chip), so serial goes over USB CDC.

[env:es3c28p]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; The devkitc-1 profile assumes 8MB flash, no PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
; QIO flash + octal (OPI) PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM

lib_deps =
    lovyan03/LovyanGFX@^1.2.7

monitor_speed = 115200
upload_speed = 921600
